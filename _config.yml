      path: "readme.md"
    values:
      title: "CSV Datasets for Machine Learning Practice"
      description: "Nine CSV datasets for machine learning practice, data cleaning, classification, regression, sentiment analysis and time-series forecasting."

# Public documentation navigation and presentation.
repository: gcfernando/machine-learning-practice-datasets
